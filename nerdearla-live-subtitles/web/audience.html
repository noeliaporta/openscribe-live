<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nerdearla · Subtítulos en vivo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#0d1117; color:#e6edf3; }
  header { padding:16px 20px; background:#161b22; border-bottom:1px solid #30363d;
           display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:18px; margin:0; margin-right:auto; }
  select { background:#0d1117; color:#e6edf3; border:1px solid #30363d;
           border-radius:8px; padding:8px 10px; font-size:15px; }
  #status { font-size:13px; color:#8b949e; }
  #dot { display:inline-block; width:9px; height:9px; border-radius:50%;
         background:#6e7681; margin-right:6px; }
  #dot.live { background:#3fb950; }
  main { padding:24px; max-width:900px; margin:0 auto; }
  #caption { min-height:46vh; font-size:30px; line-height:1.5; }
  .cue { margin-bottom:14px; }
  .cue .orig { color:#8b949e; font-size:18px; }
  footer { padding:12px 20px; font-size:12px; color:#6e7681; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>🎙️ Nerdearla · Subtítulos en vivo</h1>
  <label>Sesión
    <select id="session"></select>
  </label>
  <label>Idioma
    <select id="lang">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="original">Original</option>
    </select>
  </label>
  <span id="status"><span id="dot"></span><span id="statusText">desconectado</span></span>
</header>
<main><div id="caption"></div></main>
<footer>Open source · licencia MIT · hecho para Nerdearla Vibeathon</footer>
<script src="/static/audience.js"></script>
</body>
</html>
