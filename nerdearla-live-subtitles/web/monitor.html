<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nerdearla · Panel de monitoreo</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family:system-ui,sans-serif; background:#0d1117; color:#e6edf3; }
  main { max-width:1000px; margin:0 auto; padding:24px 20px; }
  h1 { font-size:20px; }
  table { width:100%; border-collapse:collapse; margin-top:16px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #30363d; }
  th { color:#8b949e; font-size:13px; font-weight:600; }
  .ok { color:#3fb950; } .err { color:#f85149; }
  .badge { padding:2px 8px; border-radius:999px; font-size:12px; background:#21262d; }
  a { color:#58a6ff; }
</style>
</head>
<body>
<main>
  <h1>📊 Panel de monitoreo de producción</h1>
  <p>Estado de cada sesión: suscriptores, líneas transcriptas, latencia y errores.</p>
  <table>
    <thead><tr>
      <th>Sesión</th><th>Idioma</th><th>Audiencia</th><th>Líneas</th>
      <th>Latencia</th><th>Estado</th><th>Exportar</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script src="/static/monitor.js"></script>
</body>
</html>
